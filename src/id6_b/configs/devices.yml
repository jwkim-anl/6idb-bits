# Guarneri-style device YAML configuration

id6_b.devices.monochromator.MonoDevice:
- name: mono
  prefix: "6ida1:"
  labels: ["mono", "energy device", "baseline"]

id6_b.devices.energy_device.EnergySignal:
- name: energy
  mono_name: "mono"
  labels: ["energy device", "baseline"]

id6_b.devices.aps_undulator.PolarUndulatorPair:
- name: undulators
  prefix: "S06ID:"
  labels: ["source", "energy device", "baseline"]

id6_b.devices.aps_status.StatusAPS:
- name: status_aps
  prefix: ""
  labels: ["source", "status", "baseline"]

apstools.devices.mb_creator:
- name: crl
  prefix: "6idbSoft:TRANS:"
  motors: 
    ytrans: "m1"
    xtrans: "m2"
    ztrans: "m5"
    yaw: "m3"
    pitch: "m4"
    lens1: "m6"
    lens2: "m7"
    lens3: "m8"
    lens4: "m9"
    lens5: "m10"
    lens6: "m11"
    lens7: "m12"
    lens8: "m13"
    lens9: "m14"
    lens10: "m15"
- name: mirror1
  motors:
    angle:
      factory:
        function: "id6_b.devices.pv_positioner.pvpositioner_factory"
        readback_pv: "6idaSoft:M1yt2.C"
        setpoint_pv: "6idaSoft:M1yangl"
        done_pv: "6idaSoft:M1yDMOV"
        done_value: 1
        stop_pv: "6idaSoft:allstop"
        stop_value: 1
    y_avg:
      factory:
        function: "id6_b.devices.pv_positioner.pvpositioner_factory"
        readback_pv: "6idaSoft:M1yt2.D"
        setpoint_pv: "6idaSoft:M1yavg"
        done_pv: "6idaSoft:M1yDMOV"
        done_value: 1
        stop_pv: "6idaSoft:allstop"
        stop_value: 1
    y_down:
      factory:
        function: "id6_b.devices.pv_positioner.pvpositioner_factory"
        readback_pv: "6idaSoft:M1yt2.A"
        setpoint_pv: "6idaSoft:M1ydn"
        done_pv: "6idaSoft:M1yDMOV"
        done_value: 1
        stop_pv: "6idaSoft:allstop"
        stop_value: 1
    y_up:
      factory:
        function: "id6_b.devices.pv_positioner.pvpositioner_factory"
        readback_pv: "6idaSoft:M1yt2.B"
        setpoint_pv: "6idaSoft:M1yup"
        done_pv: "6idaSoft:M1yDMOV"
        done_value: 1
        stop_pv: "6idaSoft:allstop"
        stop_value: 1

# --- Slits -------------------------------------------------------------
# sl1/sl2/sl3 are JJ-style 4-blade slits.  The four blade motors are plain
# motor records; the vertical/horizontal center and size are soft records
# computed by the IOC (transform record "Slit_N"), so those axes use the
# per-axis "class:" hook with PVPositionerSoftDoneWithStop.  The axis prefix
# is a suffix onto the bundle prefix, e.g. "6idb1:" + "Slit_1" + "Vt2.D".
- name: sl1
  prefix: "6idb1:"
  labels: ["slits", "baseline"]
  motors:
    top: "m42"
    bot: "m41"
    out: "m43"
    inb: "m44"
    vcen: &slit1_vcen
      class: "apstools.devices.PVPositionerSoftDoneWithStop"
      prefix: "Slit_1"
      readback_pv: "Vt2.D"
      setpoint_pv: "Vcenter.VAL"
      tolerance: 0.003
    vsize:
      <<: *slit1_vcen
      readback_pv: "Vt2.C"
      setpoint_pv: "Vsize.VAL"
      tolerance: 0.009
    hcen:
      <<: *slit1_vcen
      readback_pv: "Ht2.D"
      setpoint_pv: "Hcenter.VAL"
      tolerance: 0.003
    hsize:
      <<: *slit1_vcen
      readback_pv: "Ht2.C"
      setpoint_pv: "Hsize.VAL"
      tolerance: 0.003
- name: sl2
  prefix: "6idb1:"
  labels: ["slits", "baseline"]
  motors:
    top: "m45"
    bot: "m46"
    out: "m47"
    inb: "m48"
    vcen: &slit2_vcen
      class: "apstools.devices.PVPositionerSoftDoneWithStop"
      prefix: "Slit_2"
      readback_pv: "Vt2.D"
      setpoint_pv: "Vcenter.VAL"
      tolerance: 0.003
    vsize:
      <<: *slit2_vcen
      readback_pv: "Vt2.C"
      setpoint_pv: "Vsize.VAL"
      tolerance: 0.003
    hcen:
      <<: *slit2_vcen
      readback_pv: "Ht2.D"
      setpoint_pv: "Hcenter.VAL"
      tolerance: 0.003
    hsize:
      <<: *slit2_vcen
      readback_pv: "Ht2.C"
      setpoint_pv: "Hsize.VAL"
      tolerance: 0.003
- name: sl3
  prefix: "6idb1:"
  labels: ["slits", "baseline"]
  motors:
    top: "m1"
    bot: "m2"
    out: "m4"
    inb: "m3"
    vcen: &slit3_vcen
      class: "apstools.devices.PVPositionerSoftDoneWithStop"
      prefix: "Slit_3"
      readback_pv: "Vt2.D"
      setpoint_pv: "Vcenter.VAL"
      tolerance: 0.003
    vsize:
      <<: *slit3_vcen
      readback_pv: "Vt2.C"
      setpoint_pv: "Vsize.VAL"
      tolerance: 0.003
    hcen:
      <<: *slit3_vcen
      readback_pv: "Ht2.D"
      setpoint_pv: "Hcenter.VAL"
      tolerance: 0.003
    hsize:
      <<: *slit3_vcen
      readback_pv: "Ht2.C"
      setpoint_pv: "Hsize.VAL"
      tolerance: 0.003
# sl4 drives center/gap directly from motor records -- no transform record.
- name: sl4
  prefix: "6idb1:"
  labels: ["slits", "baseline"]
  motors:
    hcen: "m5"    # SL4_HCEN
    hsize: "m6"   # SL4_HGap
    vcen: "m7"    # SL4_VCEN
    vsize: "m8"   # SL4_VGap

# --- Sample environment / table motor bundles ---------------------------
- name: opty2
  prefix: "6idb1:"
  labels: ["motor_device", "baseline"]
  motors:
    hu: "m14"   # upstream horizontal   (IOC .DESC "M2U")
    hd: "m15"   # downstream horizontal (IOC .DESC "M3U")
    v1: "m11"   # upstream inboard vertical  (IOC .DESC "M1V")
    v2: "m12"   # upstream outboard vertical (IOC .DESC "M2V")
    v3: "m13"   # downstream vertical        (IOC .DESC "M3V")
- name: cryo
  prefix: "6idb1:"
  labels: ["motor_device", "baseline"]
  motors:
    x: "m34"   # Cryo Stage X
    y: "m33"   # Cryo Stage Y
    z: "m35"   # Cryo Stage Z
- name: diff
  prefix: "6idb1:"
  labels: ["motor_device", "baseline"]
  motors:
    x: "m30"    # Diff_Tab_X
    y1: "m25"   # Diff_Tab_Y1
    y2: "m26"   # Diff_Tab_Y2
# Polarization analyzer.  Axis names follow the IOC .DESC fields, which
# disagree with the old bluesky/instrument/devices/pol_analyzer.py mapping
# (it called m22 "tth" and m23 "chi").  Confirm against the hardware before
# relying on these names.
- name: analy
  prefix: "6idb1:"
  labels: ["motor_device", "baseline"]
  motors:
    tha: "m21"    # .DESC "tha"
    thp: "m22"    # .DESC "thp"
    ttha: "m23"   # .DESC "ttha"


id6_b.devices.scaler.LocalScalerCH:
- name: scaler
  prefix: "6idb1:scaler1"
  labels: ["scaler", "detectors", "baseline"]
# Second scaler record in the same IOC.  It is live and counts independently
# of scaler1, but DISABLED because its .NM1-.NM8 channel names are currently
# identical to scaler1's.  ScalerCH renames each channel signal to its EPICS
# .NM value, so both devices emit the same 8 data keys ("Seconds",
# "Ion_Chamber_1", ...); reading them in one scan collides in the event
# document.  To enable: give scaler2 distinct .NM* names in the IOC, then
# uncomment below and add "scaler2" to IDEAL_ORDER in utils/counters_class.py.
# - name: scaler2
#   prefix: "6idb1:scaler2"
#   labels: ["scaler", "detectors", "baseline"]

id6_b.devices.filters.FilterBank:
- name: filters
  prefix: "6idb1:filter:"
  labels: ["filters", "baseline"]

id6_b.devices.keithley.Keithley2400:
- name: keithley2400
  prefix: "6idb1:K24K:"
  labels: ["keithley"]

apsbits.utils.sim_creator.predefined_device:
- { creator: ophyd.sim.motor, name: sim_motor }
- { creator: ophyd.sim.noisy_det, name: sim_det }

apstools.devices.SimulatedApsPssShutterWithStatus:
- name: shutter
  labels: [ "shutters", "baseline" ]

hklpy2.creator:
- name: psic_sim
  geometry: E6C
  labels: [ "diffractometer", "hklpy2" ]
  reals: [ "mu", "eta", "chi", "phi", "nu", "delta" ]  # simulator
- name: psic
  geometry: E6C
  labels: [ "diffractometer", "hklpy2" ]
  prefix: "6idb1:"  
  reals:
    # MUST provide in canonical order
    # No defined motor assignments, pick different than fourc (m29-32)
    mu: m28
    eta: m17
    chi: m19
    phi: m20
    nu: m29
    delta: m18
- name: psic_psi
  geometry: E6C
  solver_kwargs: {"engine": "psi"}
  labels: [ "diffractometer", "hklpy2" ]
  prefix: "6idb1:"  
  reals:
    mu: m28
    eta: m17
    chi: m19
    phi: m20
    nu: m29
    delta: m18
- name: psic_q
  geometry: E6C
  solver_kwargs: {"engine": "q2"}
  labels: [ "diffractometer", "hklpy2" ]
  prefix: "6idb1:"  
  reals:
    mu: m28
    eta: m17
    chi: m19
    phi: m20
    nu: m29
    delta: m18

