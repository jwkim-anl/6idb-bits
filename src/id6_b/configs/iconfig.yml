# Configuration for the Bluesky instrument package.

# identify the version of this iconfig.yml file
ICONFIG_VERSION: 2.0.1

# Add additional configuration for use with your instrument.

### The short name for the databroker catalog.
DATABROKER_CATALOG: &databroker_catalog 6idb

### RunEngine configuration
RUN_ENGINE:
    DEFAULT_METADATA:
        beamline_id: 6-ID-B
        instrument_name: APS station 6-ID-B
        proposal_id: commissioning
        databroker_catalog: *databroker_catalog

    ### EPICS PV to use for the `scan_id`.
    ### Default: `RE.md["scan_id"]` (not using an EPICS PV)
    # SCAN_ID_PV: "IOC:bluesky_scan_id"

    ### Where to "autosave" the RE.md dictionary.
    ### Defaults:
    MD_PATH: .re_md_dict.yml

    ### The progress bar is nice to see,
    ### except when it clutters the output in Jupyter notebooks.
    ### Default: False
    USE_PROGRESS_BAR: false

### Baseline stream
### When ENABLE=true, all ophyd objects with a "baseline" label
### will be added to the baseline stream.
BASELINE_LABEL:
    ENABLE: true

### Best Effort Callback Configurations
### Defaults: all true
### except no plots in queueserver
BEC:
    BASELINE: false
    HEADING: true
    PLOTS: true
    TABLE: true

### Support for known output file formats.
### Uncomment to use.  If undefined, will not write that type of file.
### Each callback should apply its configuration from here.
NEXUS_DATA_FILES:
    ENABLE: false
    FILE_EXTENSION: hdf

SPEC_DATA_FILES:
    ENABLE: true
    FILE_EXTENSION: dat

### APS Data Management
### Learn environment variables for Data Management from this file:
DM_SETUP_FILE: "/home/dm/etc/dm.setup.sh"

# ----------------------------------

OPHYD:
    ### Control layer for ophyd to communicate with EPICS.
    ### Default: PyEpics
    ### Choices: "PyEpics" or "caproto"
    CONTROL_LAYER: PyEpics

    ### default timeouts (seconds)
    TIMEOUTS:
        PV_READ: &TIMEOUT 5
        PV_WRITE: *TIMEOUT
        PV_CONNECTION: *TIMEOUT

XMODE_DEBUG_LEVEL: Plain

### Session defaults applied automatically when the Qt GUI (`id6b-gui`) starts,
### so a session opens ready to scan.  Only the GUI reads this -- the plain
### IPython workflow and the queue server still prompt.
GUI:
    AUTO_SETUP:
        ENABLE: true

        ### Passed to experiment_setup().  An empty BASE_PATH means the
        ### directory the GUI was started in.
        EXPERIMENT:
            BASE_PATH: ""
            SAMPLE: test
            FILE_BASE_NAME: scan

        ### Passed to counters.plotselect().  Either the channel names printed
        ### by counters(), or the row indices from that table.  Prefer names: a
        ### renamed channel fails loudly and says so, while a row index that
        ### has shifted would quietly select the wrong detector.
        COUNTERS:
            DETECTORS:
                - Ion Chamber 4       # scaler,     row 4
                - Stats1              # lambda250k, row 8
            MONITOR: Time             # row 0

### Area detector output file path template.
### Used by local_scans to build per-scan NeXus master and detector HDF5 paths.
### Arguments: base_path, file_base_name, scan_id
AREA_DETECTOR:
    HDF5_FILE_TEMPLATE: "%s/%s_%05d"
